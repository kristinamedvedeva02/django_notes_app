<header>

    <nav>

        <a
            href="{% url 'home' %}"
            class="logo"
        >
            ✦ Notes
        </a>


        {% if user.is_authenticated %}

            <span class="username">
                👤 {{ user.username }}
            </span>


            <form
                method="post"
                action="{% url 'logout' %}"
                class="logout-form"
            >

                {% csrf_token %}

                <button type="submit">
                    Выйти
                </button>

            </form>


        {% else %}

            <a href="{% url 'login' %}">
                Войти
            </a>

            <a href="{% url 'register' %}">
                Регистрация
            </a>

        {% endif %}

    </nav>

</header>
